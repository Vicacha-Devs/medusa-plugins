    get:
      operationId: getAdminPlugin
      summary: List plugin
      description: GET /admin/plugin endpoint exposed by
        @vicacha-devs/medusa-plugin-social-commerce.
      tags:
        - "Admin: plugin"
      security:
        - adminBearer: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized — Admin authentication required
