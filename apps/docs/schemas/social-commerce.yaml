openapi: 3.1.0
info:
  title: "@vicacha-devs/medusa-plugin-social-commerce API"
  version: 0.0.1
  description: Multi-platform Social Commerce, Ephemeral Stories, Live Selling &
    Catalog Sync plugin for Medusa v2 (TikTok, Instagram, Facebook / Meta Graph
    API)
servers:
  - url: http://127.0.0.1:9000
    description: Local Medusa v2 Server
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Medusa Admin JWT or API token
    publishableKey:
      type: apiKey
      in: header
      name: x-publishable-api-key
      description: Medusa Storefront Publishable API Key
paths:
