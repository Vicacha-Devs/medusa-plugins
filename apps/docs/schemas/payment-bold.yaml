openapi: 3.1.0
info:
  title: "@vicacha-devs/medusa-payment-bold API"
  version: 0.0.1
  description: Comprehensive Bold Colombia payment integration for Medusa v2
    supporting Button, Links, Online API (Cards, PSE, Nequi, QR), and Smart POS
    Terminals.
servers:
  - url: http://127.0.0.1:9000
    description: Local Medusa v2 Server
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Medusa Admin JWT or API token
    publishableKey:
      type: apiKey
      in: header
      name: x-publishable-api-key
      description: Medusa Storefront Publishable API Key
paths:
  /admin/bold/banks:
    get:
      operationId: getAdminBoldBanks
      summary: List bold banks
      description: GET /admin/bold/banks endpoint exposed by
        @vicacha-devs/medusa-payment-bold.
      tags:
        - "Admin: bold"
      security:
        - adminBearer: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized — Admin authentication required
  /admin/bold/payment-button:
    post:
      operationId: postAdminBoldPaymentButton
      summary: Create / Trigger bold payment button
      description: POST /admin/bold/payment-button endpoint exposed by
        @vicacha-devs/medusa-payment-bold.
      tags:
        - "Admin: bold"
      security:
        - adminBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Successful response
