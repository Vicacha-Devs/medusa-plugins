openapi: 3.1.0
info:
  title: "@vicacha-devs/medusa-plugin-typesense API"
  version: 0.0.1
  description: Full-featured Typesense search, vector/hybrid AI search,
    merchandising (synonyms, curations, stopwords), custom entity indexing, and
    InstantSearch plugin for Medusa v2
servers:
  - url: http://127.0.0.1:9000
    description: Local Medusa v2 Server
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Medusa Admin JWT or API token
    publishableKey:
      type: apiKey
      in: header
      name: x-publishable-api-key
      description: Medusa Storefront Publishable API Key
paths:
  /admin/plugin:
    get:
      operationId: getAdminPlugin
      summary: List plugin
      description: GET /admin/plugin endpoint exposed by
        @vicacha-devs/medusa-plugin-typesense.
      tags:
        - "Admin: plugin"
      security:
        - adminBearer: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized — Admin authentication required
