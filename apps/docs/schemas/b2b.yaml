openapi: 3.1.0
info:
  title: "@vicacha-devs/medusa-plugin-b2b API"
  version: 0.0.1
  description: "B2B commerce capabilities for Medusa v2: companies, employees,
    quotes, approvals, spending limits, and B2B cart workflows."
servers:
  - url: http://127.0.0.1:9000
    description: Local Medusa v2 Server
components:
