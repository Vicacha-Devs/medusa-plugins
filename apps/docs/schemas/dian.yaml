  /admin/dian/documents/{id}/download:
    get:
      operationId: getAdminDianDocumentsByIdDownload
      summary: Get dian documents by ID download
      description: GET /admin/dian/documents/{id}/download endpoint exposed by
        @vicacha-devs/medusa-plugin-dian.
      tags:
        - "Admin: dian"
      parameters:
        - name: id
          in: path
          required: true
          description: Resource identifier (id)
          schema:
            type: string
      security:
        - adminBearer: []
      responses:
        "200":
          description: Successful response
