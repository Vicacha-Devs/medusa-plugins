openapi: 3.1.0
info:
  title: "@vicacha-devs/medusa-plugin-odoo API"
  version: 0.0.1
  description: Bidirectional Odoo ERP (Odoo 14-19+ JSON-RPC 2.0 & JSON-2 API)
    integration plugin for Medusa v2 — products & variants, multi-warehouse
    inventory & drift reconciliation, orders & invoices/payments, customers,
    POS/warehouse barcode resolver, offline POS replay, webhooks, Prometheus
    metrics, SDK, React hooks & Admin UI.
servers:
  - url: http://127.0.0.1:9000
    description: Local Medusa v2 Server
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Medusa Admin JWT or API token
    publishableKey:
      type: apiKey
      in: header
      name: x-publishable-api-key
      description: Medusa Storefront Publishable API Key
paths:
  /admin/odoo/config:
    get:
      operationId: getAdminOdooConfig
      summary: List odoo config
      description: GET /admin/odoo/config endpoint exposed by
        @vicacha-devs/medusa-plugin-odoo.
      tags:
        - "Admin: odoo"
      security:
        - adminBearer: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized — Admin authentication required
    post:
      operationId: postAdminOdooConfig
      summary: Create / Trigger odoo config
      description: POST /admin/odoo/config endpoint exposed by
        @vicacha-devs/medusa-plugin-odoo.
      tags:
