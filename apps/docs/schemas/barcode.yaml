openapi: 3.1.0
info:
  title: "@vicacha-devs/medusa-plugin-barcode API"
  version: 0.0.1
  description: Unified 4-in-1 Barcode, GS1, Dynamic QR, Multi-Provider GTIN
    Lookup, Thermal/Sheet Label Printing (HTML/SVG & ZPL II), Anti-Counterfeit
    Verification & Warehouse Stock-Take Scanner plugin for Medusa v2.
servers:
  - url: http://127.0.0.1:9000
    description: Local Medusa v2 Server
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Medusa Admin JWT or API token
    publishableKey:
      type: apiKey
      in: header
      name: x-publishable-api-key
      description: Medusa Storefront Publishable API Key
paths:
  /admin/barcodes:
    get:
      operationId: getAdminBarcodes
      summary: List barcodes
      description: GET /admin/barcodes endpoint exposed by
        @vicacha-devs/medusa-plugin-barcode.
      tags:
        - "Admin: barcodes"
      security:
        - adminBearer: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized — Admin authentication required
  /admin/barcodes/{barcode}:
    delete:
      operationId: deleteAdminBarcodesByBarcode
      summary: Delete barcodes by ID
      description: DELETE /admin/barcodes/{barcode} endpoint exposed by
        @vicacha-devs/medusa-plugin-barcode.
