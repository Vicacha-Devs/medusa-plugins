openapi: 3.1.0
info:
  title: "@vicacha-devs/medusa-plugin-documents API"
  version: 0.0.1
  description: "Comprehensive commercial documents plugin for Medusa v2: Invoices,
    Packing Slips, Credit Notes & POS Receipts with Dual PDF Engine
    (@react-pdf/renderer + Handlebars/pdfmake), per-region settings, 10-locale
    i18n (including RTL Arabic & Turkish), localized Admin UI, optional B2B
    context, and optional Docuseal e-signatures."
servers:
  - url: http://127.0.0.1:9000
    description: Local Medusa v2 Server
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Medusa Admin JWT or API token
    publishableKey:
      type: apiKey
      in: header
      name: x-publishable-api-key
      description: Medusa Storefront Publishable API Key
paths:
  /admin/documents:
    get:
      operationId: getAdminDocuments
      summary: List documents
      description: GET /admin/documents endpoint exposed by
        @vicacha-devs/medusa-plugin-documents.
      tags:
        - "Admin: documents"
      security:
        - adminBearer: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized — Admin authentication required
    post:
      operationId: postAdminDocuments
      summary: Create / Trigger documents
      description: POST /admin/documents endpoint exposed by
        @vicacha-devs/medusa-plugin-documents.
      tags:
        - "Admin: documents"
