openapi: 3.1.0
info:
  title: "@vicacha-devs/medusa-plugin-product-extensions API"
  version: 0.0.1
  description:
    Medusa v2 Product Extension Suite — Rich Video & 3D Media, Variant
    Galleries with Option Bulk-Assignment, Typed Custom Attributes with
    SI/Imperial Normalization, Hierarchical Content Sections (tree@1/diff@1),
    Feature Badges, Swatches, Multi-Storefront Overrides, Admin Studio &
    Storefront UI Kit (100% compatible with @bambiste/medusa-product-ext)
servers:
  - url: http://127.0.0.1:9000
    description: Local Medusa v2 Server
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Medusa Admin JWT or API token
    publishableKey:
      type: apiKey
      in: header
      name: x-publishable-api-key
      description: Medusa Storefront Publishable API Key
paths:
  /admin/plugin:
    get:
      operationId: getAdminPlugin
      summary: List plugin
      description: GET /admin/plugin endpoint exposed by
        @vicacha-devs/medusa-plugin-product-extensions.
      tags:
        - "Admin: plugin"
      security:
        - adminBearer: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized — Admin authentication required
  /admin/product-ext/attributes:
