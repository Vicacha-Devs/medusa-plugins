openapi: 3.1.0
info:
  title: "@vicacha-devs/medusa-plugin-notifications API"
  version: 0.0.1
  description: "Unified multi-channel notification studio for Medusa v2: visual
    and raw template builder, event mappings, consent ledger, abandoned cart
    recovery, broadcasts, and Email, WhatsApp, Telegram, SMS, Slack and sandbox
    providers."
servers:
  - url: http://127.0.0.1:9000
    description: Local Medusa v2 Server
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Medusa Admin JWT or API token
    publishableKey:
      type: apiKey
      in: header
      name: x-publishable-api-key
      description: Medusa Storefront Publishable API Key
paths:
  /admin/mpn/broadcasts:
    get:
      operationId: getAdminMpnBroadcasts
      summary: List mpn broadcasts
      description: GET /admin/mpn/broadcasts endpoint exposed by
        @vicacha-devs/medusa-plugin-notifications.
      tags:
        - "Admin: mpn"
      security:
        - adminBearer: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized — Admin authentication required
    post:
      operationId: postAdminMpnBroadcasts
      summary: Create / Trigger mpn broadcasts
      description: POST /admin/mpn/broadcasts endpoint exposed by
        @vicacha-devs/medusa-plugin-notifications.
      tags:
        - "Admin: mpn"
      security:
        - adminBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
