name: Bug Report
description: Report a bug in any @vicacha-devs Medusa v2 plugin or the sandbox/docs apps
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      options:
        - "@vicacha-devs/medusa-plugin-b2b"
        - "@vicacha-devs/medusa-plugin-barcode"
        - "@vicacha-devs/medusa-plugin-dian"
        - "@vicacha-devs/medusa-plugin-documents"
        - "@vicacha-devs/medusa-fulfillment-eu"
        - "@vicacha-devs/medusa-plugin-notifications"
        - "@vicacha-devs/medusa-plugin-odoo"
        - "@vicacha-devs/medusa-payment-bold"
        - "@vicacha-devs/medusa-payment-mollie"
        - "@vicacha-devs/medusa-plugin-product-extensions"
        - "@vicacha-devs/medusa-plugin-social-commerce"
        - "@vicacha-devs/medusa-plugin-stories"
        - "@vicacha-devs/medusa-plugin-typesense"
        - "@vicacha-devs/medusa-shared-admin"
        - "@vicacha-devs/medusa-sandbox"
        - "@vicacha-devs/docs"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Package & Medusa v2 Version
      placeholder: "e.g. plugin 0.0.1, @medusajs/medusa 2.23.0, Node 22.22.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Configure plugin in medusa-config.ts
        2. Run ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Stack Trace
      render: shell
