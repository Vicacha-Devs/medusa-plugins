name: Bold Live Sandbox Contract Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # Weekly Monday 07:00 UTC upstream contract check

permissions:
  contents: read

jobs:
  bold-sandbox-contract:
    name: Verify Upstream Bold Sandbox API Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run offline Bold 4-channel emulator suite
        working-directory: ./packages/payment-bold
        run: node --import ./src/__tests__/register-ts-resolver.mjs --test src/__tests__/*.spec.ts
      - name: Run live Bold sandbox read-only contract check (when secrets configured)
        if: env.BOLD_SANDBOX_INTEGRATION_KEY != '' && env.BOLD_SANDBOX_BUTTON_KEY != ''
        working-directory: ./packages/payment-bold
        env:
          BOLD_SANDBOX_INTEGRATION_KEY: ${{ secrets.BOLD_SANDBOX_INTEGRATION_KEY }}
          BOLD_SANDBOX_BUTTON_KEY: ${{ secrets.BOLD_SANDBOX_BUTTON_KEY }}
        run: |
          node --import ./src/__tests__/register-ts-resolver.mjs -e '
            import assert from "node:assert/strict"
            import { BoldHttpClient } from "./src/services/bold-client.ts"
            const client = new BoldHttpClient(
              {
                integrationApiKey: process.env.BOLD_SANDBOX_INTEGRATION_KEY,
                buttonApiKey: process.env.BOLD_SANDBOX_BUTTON_KEY,
                defaultCurrency: "COP",
              },
              { debug() {}, info() {}, warn() {}, error() {} }
            )
            const linkMethods = await client.getAvailablePaymentLinkPaymentMethods()
            assert.ok(linkMethods && typeof linkMethods === "object")
            const banks = await client.getPseBanks()
            assert.ok(Array.isArray(banks))
            process.stdout.write("[OK] Live Bold sandbox contract verified (" + banks.length + " PSE banks)\n")
          '
